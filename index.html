<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<meta name="description" content="Intercontinental Play — filmes, documentários e entretenimento. Entrou, clicou, assistiu!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Intercontinental Play</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23111b39%22/%3E%3Cpath d=%22M39 25 L76 50 L39 75Z%22 fill=%22%23ffc857%22/%3E%3C/svg%3E">

<style>
:root {
  --bg:#090d1b;
  --panel:#141c32;
  --panel2:#1b2743;
  --gold:#ffc857;
  --cyan:#39d8e8;
  --text:#f5f7ff;
  --muted:#aebbd3;
}
* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {
  margin:0;
  background:radial-gradient(circle at top,#1b3155 0,#090d1b 48%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
button,input {font:inherit}
button {cursor:pointer}
img {max-width:100%;display:block}

header {
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,13,28,.96);
  border-bottom:1px solid #293858;
  backdrop-filter:blur(12px);
}
.header-inner {
  max-width:1400px;
  margin:auto;
  padding:13px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.brand-mark {
  width:52px;
  height:52px;
  flex:0 0 52px;
  display:grid;
  place-items:center;
  border-radius:16px;
  color:#111a2d;
  font-size:22px;
  background:linear-gradient(135deg,#fff0b4,#ffc34f 55%,#6ee4ed);
  box-shadow:0 0 22px #ffc85744;
}
.brand h1 {
  font-size:clamp(17px,3vw,25px);
  margin:0;
  color:var(--gold);
  letter-spacing:1px;
  overflow-wrap:anywhere;
}
.brand small {color:var(--muted);font-size:11px}
nav {
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
nav a {
  color:#e9efff;
  text-decoration:none;
  padding:9px 12px;
  border-radius:20px;
  font-size:13px;
}
nav a:hover {background:#263858;color:var(--gold)}
.install-btn,.primary-btn {
  border:0;
  border-radius:22px;
  padding:11px 17px;
  background:linear-gradient(120deg,#ffcc5c,#ff9d43);
  color:#172039;
  font-weight:bold;
}
.install-btn:hover,.primary-btn:hover {filter:brightness(1.1)}
main {max-width:1400px;margin:auto;padding:22px}

.hero {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:20px;
  align-items:center;
  padding:30px;
  border:1px solid #33476d;
  border-radius:24px;
  background:linear-gradient(120deg,#1b3155,#18213b 65%,#30264a);
  overflow:hidden;
}
.hero h2 {
  max-width:900px;
  font-size:clamp(27px,5vw,48px);
  line-height:1.12;
  margin:0 0 12px;
  overflow-wrap:anywhere;
}
.hero h2 span {color:var(--gold)}
.hero p {color:#d0d9eb;line-height:1.6;margin:0 0 18px}
.hero-tag {
  display:inline-block;
  color:#12203a;
  background:var(--cyan);
  border-radius:20px;
  padding:7px 12px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:12px;
}
.player-section {margin-top:28px}
.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin:25px 0 14px;
}
.section-title h2 {margin:0;font-size:22px}
.player-box {
  background:#050812;
  border:1px solid #34466a;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 15px 45px #0007;
}
.player-screen {
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.player-screen iframe {width:100%;height:100%;border:0}
.player-placeholder {
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  color:#b9c5dc;
}
.play-symbol {font-size:55px;color:var(--gold)}
.player-info {
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  background:#111a2e;
}
.player-info h3 {margin:0 0 5px;font-size:18px}
.player-info p {margin:0;color:var(--muted);font-size:12px}
.player-actions {display:flex;gap:8px;flex-wrap:wrap}
.action-btn {
  border:1px solid #435779;
  background:#202d49;
  color:white;
  border-radius:20px;
  padding:9px 13px;
}
.action-btn:hover {background:#344969}

.search-row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
}
.search-row input {
  flex:1 1 240px;
  min-width:0;
  border:1px solid #405477;
  background:#111a2e;
  color:white;
  padding:13px 16px;
  border-radius:25px;
  outline:none;
}
.search-row input:focus {border-color:var(--cyan)}
.filters {display:flex;gap:8px;flex-wrap:wrap}
.filter-btn {
  padding:9px 15px;
  border-radius:20px;
  color:#dce6fa;
  background:#1a2741;
  border:1px solid #35496c;
}
.filter-btn.active {
  background:var(--gold);
  color:#172039;
  border-color:var(--gold);
  font-weight:bold;
}
.catalog {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));
  gap:17px;
}
.movie-card {
  min-width:0;
  overflow:hidden;
  border:1px solid #293c60;
  border-radius:15px;
  background:linear-gradient(160deg,#192641,#10182b);
  transition:transform .2s,border-color .2s,box-shadow .2s;
  cursor:pointer;
}
.movie-card:hover {
  transform:translateY(-5px);
  border-color:var(--gold);
  box-shadow:0 12px 25px #0007;
}
.movie-card.selected {border:2px solid var(--cyan)}
.poster {
  aspect-ratio:16/10;
  position:relative;
  background:#202b42;
  overflow:hidden;
}
.poster img {width:100%;height:100%;object-fit:cover}
.poster-number {
  position:absolute;
  top:8px;
  left:8px;
  background:#080d1bdc;
  color:var(--gold);
  padding:5px 8px;
  border-radius:12px;
  font-size:11px;
}
.movie-details {padding:11px}
.movie-details h3 {
  font-size:14px;
  margin:0 0 10px;
  line-height:1.4;
  overflow-wrap:anywhere;
}
.movie-details button {
  border:0;
  border-radius:18px;
  padding:7px 10px;
  background:#263b60;
  color:white;
  font-size:11px;
}
.movie-details button:hover {background:#3c5b89}
.empty {color:var(--muted);padding:25px 0}
.promo {
  margin:30px 0;
  border:1px solid #6a5833;
  border-radius:18px;
  padding:20px;
  background:linear-gradient(110deg,#40321d,#1d2944);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:15px;
}
.promo h2 {margin:0 0 6px;color:var(--gold)}
.promo p {margin:0;color:#e0e6f3;line-height:1.5}
footer {
  text-align:center;
  padding:30px 18px;
  margin-top:35px;
  border-top:1px solid #293858;
  color:#9eacc7;
  font-size:13px;
  line-height:1.7;
}
.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#263b60;
  border:1px solid #6681a9;
  color:white;
  padding:12px 18px;
  border-radius:25px;
  z-index:100;
  box-shadow:0 8px 25px #0008;
  display:none;
  max-width:90%;
  text-align:center;
}

@media(max-width:760px) {
  .header-inner {justify-content:center}
  .brand {width:100%;justify-content:center}
  nav {justify-content:center}
  .hero {grid-template-columns:1fr;text-align:center;padding:23px}
    main {padding:15px}
}
@media(max-width:430px) {
  .header-inner {padding:12px}
  nav a {padding:8px;font-size:12px}
  .install-btn {width:100%}
  .hero {padding:19px}
  .catalog {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .movie-details {padding:9px}
  .movie-details h3 {font-size:12px}
  .player-info {align-items:flex-start}
  .player-actions {width:100%}
  .player-actions button {flex:1}
}
