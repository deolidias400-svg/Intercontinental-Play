<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060919">
<title>Intercontinental Play - Cyber Cinema</title>

<style>
:root{
  --bg:#060919;
  --panel:#0d1326;
  --cyan:#00f3ff;
  --purple:#a66bff;
  --gold:#f4cb70;
  --pink:#ff007f;
  --text:#f5f7ff;
  --muted:#8e9bbd;
  --cyber-border:rgba(0,243,255,0.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(166,107,255,0.15), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(0,243,255,0.12), transparent 40%);
}

/* SCROLLBAR */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#1f2b4d;border-radius:4px;border:1px solid var(--cyber-border)}
::-webkit-scrollbar-thumb:hover{background:var(--cyan)}

/* HEADER HOLOGRÁFICO */
header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;padding:12px 5%;
  background:rgba(6,9,25,0.9);
  border-bottom:1px solid var(--cyber-border);
  backdrop-filter:blur(20px);
  box-shadow:0 4px 30px rgba(0,243,255,0.08);
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo-wrap{
  position:relative;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  padding:2px;box-shadow:0 0 20px rgba(0,243,255,0.6);
}
.brand img{
  width:100%;height:100%;object-fit:cover;border-radius:50%;background:var(--bg);
}
.brand-name{
  font-size:20px;font-weight:900;letter-spacing:1.5px;
  color:var(--text);line-height:1;text-transform:uppercase;
}
.brand-name span{
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.brand small{
  display:block;font-size:9px;color:var(--cyan);
  letter-spacing:3px;margin-top:4px;font-weight:bold;
  text-shadow:0 0 8px rgba(0,243,255,0.6);
}
nav{display:flex;gap:24px}
nav a{
  color:var(--muted);text-decoration:none;font-size:14px;
  font-weight:600;letter-spacing:0.5px;transition:all 0.3s;
}
nav a:hover,nav a.active{
  color:var(--cyan);text-shadow:0 0 10px rgba(0,243,255,0.8);
}
.search-box{position:relative;width:240px}
.search{
  width:100%;padding:10px 16px;border-radius:20px;
  border:1px solid var(--cyber-border);background:rgba(13,19,38,0.8);
  color:white;outline:none;font-size:13px;transition:0.3s;
}
.search:focus{
  border-color:var(--cyan);
  box-shadow:0 0 15px rgba(0,243,255,0.4);
  background:#141d38;
}

/* HERO SECTION */
.hero{
  position:relative;min-height:480px;overflow:hidden;
  display:flex;align-items:center;padding:60px 7%;
  background:
    radial-gradient(ellipse at 75% 50%,rgba(166,107,255,0.25) 0%,transparent 55%),
    linear-gradient(110deg,#090e24,#060919 60%,#12102b);
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.hero-content{position:relative;z-index:3;max-width:600px}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--cyan);font-size:11px;letter-spacing:3px;font-weight:800;
  background:rgba(0,243,255,0.1);padding:6px 14px;border-radius:20px;
  border:1px solid rgba(0,243,255,0.3);margin-bottom:15px;
}
.hero h1{
  font-size:clamp(36px,5.5vw,62px);line-height:1.05;margin:10px 0 18px;font-weight:900;
  background:linear-gradient(135deg,#ffffff 40%,var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 10px 30px rgba(0,0,0,0.8);
}
.hero p{color:#a0aec0;line-height:1.7;font-size:15px;max-width:500px;margin-bottom:25px}
.hero-buttons{display:flex;gap:15px;flex-wrap:wrap}
.btn{
  border:0;border-radius:8px;padding:14px 28px;
  font-weight:800;font-size:13px;letter-spacing:1px;cursor:pointer;
  transition:all 0.3s cubic-bezier(0.2,0.8,0.2,1);
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 25px rgba(0,243,255,0.4)}
.btn-main{
  background:linear-gradient(135deg,var(--cyan),#00a8ff);
  color:#040714;box-shadow:0 4px 20px rgba(0,243,255,0.3);
}
.btn-secondary{
  color:white;background:rgba(255,255,255,0.05);
  border:1px solid var(--cyber-border);backdrop-filter:blur(10px);
}
.hero-mascot{
  position:absolute;right:5%;bottom:-10px;width:min(38%,420px);height:95%;
  object-fit:contain;object-position:center bottom;
  filter:drop-shadow(0 0 35px rgba(0,243,255,0.4));z-index:2;
  animation:float 6s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

/* BANNER DE EVENTOS E PROPAGANDAS INTELIGENTE */
.promo-banner{
  margin:20px 7% 0;padding:16px 24px;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,0,127,0.15),rgba(0,243,255,0.1));
  border:1px solid rgba(255,0,127,0.4);
  display:flex;align-items:center;justify-content:space-between;gap:15px;
  box-shadow:0 0 25px rgba(255,0,127,0.15);
}
.promo-info h3{margin:0 0 4px;font-size:16px;color:var(--pink);display:flex;align-items:center;gap:8px}
.promo-info p{margin:0;font-size:13px;color:var(--muted)}
.promo-btn{
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:white;border:0;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer;
  transition:0.3s;white-space:nowrap;box-shadow:0 0 15px rgba(255,0,127,0.4);
}
.promo-btn:hover{filter:brightness(1.2);transform:scale(1.05)}

main{padding:20px 5% 80px}
.section{margin:40px 0 50px}
.section-heading{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:12px;margin-bottom:20px;border-left:4px solid var(--cyan);padding-left:12px;
}
.section-heading h2{font-size:22px;margin:0;font-weight:800;letter-spacing:0.5px}
.section-heading small{color:var(--cyan);font-size:12px;letter-spacing:1px}

/* FILTROS */
.filters{display:flex;gap:10px;overflow-x:auto;padding:5px 2px 18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex-shrink:0;border:1px solid rgba(255,255,255,0.1);
  background:rgba(13,19,38,0.6);color:var(--muted);
  border-radius:30px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.3s;
}
.filter:hover,.filter.active{
  background:linear-gradient(135deg,rgba(0,243,255,0.2),rgba(166,107,255,0.2));
  border-color:var(--cyan);color:white;box-shadow:0 0 15px rgba(0,243,255,0.3);
}

/* GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:28px 18px;
}
.movie{min-width:0;cursor:pointer;position:relative}
.poster{
  width:100%;aspect-ratio:2/3;overflow:hidden;position:relative;border-radius:12px;
  background:#0b1021;border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  transition:all 0.4s cubic-bezier(0.165,0.84,0.44,1);
}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s}
.movie:hover .poster{
  transform:translateY(-8px) scale(1.03);border-color:var(--cyan);
  box-shadow:0 15px 35px rgba(0,0,0,0.8),0 0 25px rgba(0,243,255,0.4);
}
.movie:hover .poster img{transform:scale(1.1)}
.poster::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(6,9,25,0.95) 0%,transparent 60%);pointer-events:none;
}
.poster-overlay{
  position:absolute;inset:0;z-index:2;display:grid;place-items:center;
  opacity:0;transition:0.3s;background:rgba(6,9,25,0.4);backdrop-filter:blur(2px);
}
.movie:hover .poster-overlay{opacity:1}
.play-circle{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--cyan),var(--purple));color:#040714;
  font-size:22px;box-shadow:0 0 25px rgba(0,243,255,0.8);
  transform:scale(0.8);transition:transform 0.3s;
}
.movie:hover .play-circle{transform:scale(1)}
.movie h3{
  font-size:14px;margin:12px 2px 4px;line-height:1.3;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.genre{font-size:11px;color:var(--muted);margin:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{
  position:absolute;top:10px;right:10px;z-index:4;width:36px;height:36px;
  border:1px solid rgba(255,255,255,0.15);border-radius:50%;
  background:rgba(6,9,25,0.7);backdrop-filter:blur(8px);color:white;
  font-size:16px;cursor:pointer;transition:0.3s;display:grid;place-items:center;
}
.fav:hover{transform:scale(1.15);border-color:var(--pink)}
.fav.on{color:var(--pink);border-color:var(--pink);box-shadow:0 0 12px rgba(255,0,127,0.6)}
.empty{
  padding:40px;text-align:center;color:var(--muted);
  background:rgba(13,19,38,0.4);border:1px dashed var(--cyber-border);
  border-radius:12px;grid-column:1/-1;
}

/* PLAYER DE CINEMA COLORIDO E INTELIGENTE */
#playerArea{
  display:none;margin:20px 0 50px;padding:24px;border-radius:20px;
  background:linear-gradient(135deg,#131a38,#070a17);
  border:1px solid var(--cyber-border);
  box-shadow:0 20px 60px rgba(0,0,0,0.85),0 0 35px rgba(0,243,255,0.2);
}
.player-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.player-head h2{margin:4px 0 0;color:var(--cyan);font-size:24px;font-weight:800;text-shadow:0 0 12px rgba(0,243,255,0.5)}
.lcd-label{color:var(--pink);font-size:10px;letter-spacing:3px;font-weight:bold}
.close{
  border:1px solid var(--cyber-border);background:rgba(255,255,255,0.05);
  color:white;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:700;transition:0.3s;
}
.close:hover{background:var(--pink);border-color:var(--pink)}
.screen{
  position:relative;padding:6px;border-radius:14px;
  background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink),var(--gold));
  box-shadow:0 0 35px rgba(0,243,255,0.3);
}
.screen-inner{position:relative;padding-bottom:56.25%;height:0;background:#000;border-radius:10px;overflow:hidden}
.screen-inner iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-info{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:#d6def4;font-size:14px;margin-top:18px}
.lcd-status{
  display:inline-flex;align-items:center;gap:8px;color:var(--cyan);font-size:12px;letter-spacing:1px;
}
.lcd-status::before{
  content:"";width:8px;height:8px;background:var(--cyan);border-radius:50%;
  box-shadow:0 0 10px var(--cyan);animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:0.3}
}

/* FOOTER */
footer{text-align:center;padding:40px 15px;border-top:1px solid rgba(255,255,255,0.08);color:var(--muted);font-size:13px}
footer strong{color:var(--cyan)}

/* TOAST NEON */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:1000;
  background:rgba(13,19,38,0.95);color:white;padding:14px 28px;
  border:1px solid var(--cyan);border-radius:30px;display:none;
  box-shadow:0 10px 30px rgba(0,243,255,0.4);backdrop-filter:blur(10px);
  font-weight:600;font-size:14px;
}

@media(max-width:760px){
  header{flex-wrap:wrap;padding:12px 4%}
  nav{order:3;width:100%;justify-content:center;gap:15px;margin-top:5px}
  .search-box{width:100%;order:4}
  .hero{min-height:420px;padding:35px 5%}
  .hero-mascot{width:60%;right:-10%;opacity:0.35}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .promo-banner{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="brand-logo-wrap">
      <img src="mascote-intercontinental.png" alt="Logo" onerror="this.src='https://via.placeholder.com/50/00f3ff/000000?text=IP'">
    </div>
    <div class="brand-name">
      INTERCONTINENTAL <span>PLAY</span>
      <small>CINEMA & EXPERIÊNCIA</small>
    </div>
  </div>
  
  <nav>
    <a href="#inicio" class="active">Início</a>
    <a href="#catalogo">Catálogo</a>
    <a href="#favoritos">Minha Lista</a>
  </nav>

  <div class="search-box">
    <input class="search" id="search" placeholder="⌕ Buscar no catálogo..." oninput="render()">
  </div>
</header>

<section class="hero" id="inicio">
  <div class="hero-content">
    <div class="kicker">⚡ STREAMING FUTURISTA & INTERATIVO</div>
    <h1>O cinema em uma nova dimensão.</h1>
    <p>Explore o catálogo completo de super
